import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer

dependencies {
    api project(":base")
    api project(':protocol')

    implementation 'com.google.code.gson:gson:2.11.0'

    api 'org.jline:jline-reader:3.23.0'
    api 'org.jline:jline-terminal:3.23.0'
    api 'org.jline:jline-terminal-jansi:3.23.0'
    api 'net.minecrell:terminalconsoleappender:1.3.0'

    api 'org.apache.logging.log4j:log4j-core:2.20.0'
    api 'org.apache.logging.log4j:log4j-iostreams:2.20.0'

    api 'commons-cli:commons-cli:1.3.1'

    api project(":impl-loader")
    annotationProcessor project(":impl-loader")
}

repositories {
    maven {
        url 'https://repo.papermc.io/repository/maven-public/'
    }
}

tasks {
    shadowJar {
        transform new Log4j2PluginsCacheFileTransformer()

        def output = rootProject.ext.get('output')
        destinationDirectory = file("$rootDir/$output")

        archiveFileName = "MegamindApp.jar"

        manifest {
            attributes(
                    "Main-Class": "net.skykingdoms.backend.megamind.boot.MegamindBoot"
            )
        }
    }
}