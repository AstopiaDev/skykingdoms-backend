dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'// https://mvnrepository.com/artifact/com.squareup.okhttp/okhttp
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.12.0'

    implementation project(path: ':protocol')
}

tasks {
    shadowJar {
        archiveFileName = "TcpShield-Megamind.jar"
    }
}