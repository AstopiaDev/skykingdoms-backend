dependencies {
    api project(":base")
    api project(':protocol')
    api project(':megamind-api')
    implementation 'com.squareup:javapoet:1.13.0'
}

subprojects {
    dependencies {
        api project(":impl-loader")
        api project(":minimind")
        annotationProcessor project(":impl-loader")
        annotationProcessor project(':minimind')
    }

    tasks {
        shadowJar {
            def output = rootProject.ext.get('output')
            destinationDirectory = file("$rootDir/$output")
        }
    }
}